<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDY MATCH</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f4f5f8;color:#191919}
.app{max-width:760px;margin:auto;padding:18px 15px 55px}.screen{min-height:92vh;display:flex;align-items:center}.card{width:100%;background:#fff;border-radius:30px;padding:30px;box-shadow:0 12px 35px #0000000c}
.hero{text-align:center;padding:45px 25px}.logo{font-size:15px;font-weight:900;letter-spacing:3px}.hero h1{font-size:44px;line-height:1.1;margin:18px 0 14px}.hero p{color:#707070;line-height:1.7}.start{margin-top:25px}
button{border:0;cursor:pointer;font:inherit}.primary{width:100%;padding:17px;border-radius:16px;background:#191919;color:white;font-weight:800;font-size:17px}.secondary{width:100%;padding:15px;border-radius:16px;background:#eee;margin-top:10px;font-weight:700}
.meta{display:flex;justify-content:space-between;color:#777;font-size:14px}.progress{height:8px;background:#eee;border-radius:99px;margin:15px 0 30px;overflow:hidden}.progress div{height:100%;background:#191919;transition:.25s}
.q{font-size:23px;font-weight:800;line-height:1.5;margin:0 0 24px}.choice{display:block;border:1.5px solid #e1e1e1;border-radius:16px;padding:15px;margin:10px 0;cursor:pointer;transition:.15s}.choice:hover{background:#f6f6f6}.choice input{margin-right:9px}
.result{text-align:center}.result h1{font-size:48px;margin:5px 0}.type{font-size:25px;font-weight:900;margin-bottom:24px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.pill{background:#f5f5f5;border-radius:18px;padding:16px;line-height:1.5}.pill b{display:block;font-size:17px;margin-bottom:5px}
.section{text-align:left;border-top:1px solid #eee;margin-top:25px;padding-top:22px}.section h2{font-size:20px;margin:0 0 10px}.section p{line-height:1.8;margin:0;color:#444}.note{font-size:12px!important;color:#888!important;margin-top:24px!important}
.hidden{display:none!important}.emoji{font-size:35px}.tag{display:inline-block;background:#eee;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;margin:4px}
@media(max-width:500px){.hero h1{font-size:37px}.q{font-size:20px}.result h1{font-size:42px}.card{padding:23px}.profile{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div id="home" class="screen"><div class="card hero">
<div class="logo">EDUCATION CLUB PROJECT</div><div class="emoji">📚</div>
<h1>STUDY<br>MATCH</h1>
<p>나는 어떤 방식으로 공부할 때<br>가장 잘 맞을까?</p>
<p>20개의 질문에 답하면<br>나에게 맞는 학습 프로필과 수업 방식을 찾아드려요.</p>
<button class="primary start" onclick="start()">검사 시작하기 →</button>
</div></div>

<div id="quiz" class="screen hidden"><div class="card">
<div class="meta"><span id="num"></span><span>20문항</span></div><div class="progress"><div id="bar"></div></div>
<p class="q" id="q"></p><div id="choices"></div>
<button class="primary" onclick="next()">다음 →</button>
</div></div>

<div id="result" class="screen hidden"><div class="card result">
<p class="tag">MY STUDY PROFILE</p>
<p>당신의 학습 유형은</p><h1 id="code"></h1><div class="type" id="type"></div>
<div class="profile" id="profile"></div>
<div class="section"><h2>📚 나에게 맞는 공부법</h2><p id="study"></p></div>
<div class="section"><h2>👩‍🏫 나에게 잘 맞는 선생님</h2><p id="teacher"></p></div>
<div class="section"><h2>✨ 한 줄 정리</h2><p id="summary"></p></div>
<p class="note">이 검사는 교육동아리 프로젝트를 위한 학습 성향 설문입니다. 학습 능력이나 성격을 확정적으로 판단하는 검사는 아닙니다.</p>
<button class="primary" onclick="restart()">다시 검사하기</button>
<button class="secondary" onclick="goHome()">처음으로</button>
</div></div>
</div>
<script>
const Q=[
["수업 내용을 직접 노트에 적으면서 공부하면 기억에 더 잘 남는다.","W"],["중요한 내용을 내 방식대로 다시 정리해서 써보는 것이 이해하는 데 도움이 된다.","W"],["교과서나 필기 내용을 여러 번 읽어보는 것만으로도 내용을 잘 기억할 수 있다.","L"],["공부할 때 직접 적기보다 정리된 내용을 반복해서 읽는 것이 편하다.","L"],["시험 전에 내용을 다시 써보는 것보다 교과서나 필기를 여러 번 읽어보는 것이 효율적이다.","L"],
["혼자 조용한 환경에서 공부할 때 가장 집중이 잘 된다.","I"],["다른 사람의 도움 없이 스스로 문제를 해결해 보는 것을 선호한다.","I"],["친구와 함께 공부하면서 서로 질문하고 답하는 것이 공부에 도움이 된다.","E"],["모르는 내용을 친구에게 설명하거나 친구의 설명을 들으면 이해가 더 잘 된다.","E"],["혼자 공부하는 것보다 친구들과 함께 공부할 때 공부 의욕이 높아진다.","E"],
["그림이나 도표로 정리된 내용을 보면 글로만 설명된 내용보다 이해하기 쉽다.","V"],["그래프나 사진 등의 자료가 있으면 내용을 기억하기 쉽다.","V"],["선생님의 설명을 듣는 것만으로도 새로운 내용을 이해하고 기억할 수 있다.","S"],["공부할 때 소리 내어 읽거나 다른 사람에게 설명하면 기억이 더 잘 된다.","S"],["글이나 그림을 보는 것보다 직접 설명을 듣는 것이 내용을 이해하는 데 도움이 된다.","S"],
["선생님이 교과서나 PPT를 중심으로 설명해 주는 수업이 이해하기 편하다.","B"],["교과서에 있는 내용을 따라가면서 설명을 듣는 수업이 좋다.","B"],["선생님이 칠판에 직접 내용을 정리해 주는 수업이 이해하기 쉽다.","C"],["선생님이 수업 중 직접 판서하면서 설명해 주면 내용이 더 잘 기억된다.","C"],["교과서나 PPT보다 선생님의 판서 내용을 따라가며 공부하는 것이 편하다.","C"]
];
const INFO={
W:["✍️","쓰기형","직접 쓰고 정리하며 이해하는 편"],L:["📖","보기형","정리된 내용을 읽으며 기억하는 편"],
I:["👤","개인학습형","혼자 자신의 속도로 공부할 때 집중이 잘 되는 편"],E:["👥","협력학습형","친구와 질문하고 설명하며 이해를 높이는 편"],
V:["👀","시각형","그림·도표·그래프 등 시각 자료가 도움이 되는 편"],S:["🎧","청각형","설명을 듣거나 말하면서 기억하는 편"],
B:["📖","교과서형","교과서나 PPT 중심 수업을 선호하는 편"],C:["📝","판서형","선생님의 판서를 따라가며 정리하는 수업을 선호하는 편"]
};
const TYPES={
WIVB:["정리 시각형","직접 정리하고 시각 자료와 교과서를 활용할 때 편한 유형"],
WIVC:["정리 판서형","직접 쓰고 정리하며 시각 자료와 판서를 활용할 때 편한 유형"],
WISB:["청각 자기주도형","직접 정리하고 혼자 공부하며 설명을 들을 때 편한 유형"],
WISC:["자기주도 정리형","직접 정리하고 혼자 공부하며 설명과 판서를 활용하는 유형"],
WEVB:["협력 시각형","직접 정리하고 친구와 함께 시각 자료를 활용하는 유형"],
WEVC:["협력 판서형","직접 정리하고 친구와 의견을 나누며 판서를 활용하는 유형"],
WESB:["협력 청각형","직접 정리하고 친구와 설명을 주고받으며 듣는 수업을 활용하는 유형"],
WESC:["소통 정리형","직접 정리하고 친구와 소통하며 설명과 판서를 활용하는 유형"],
LIVB:["개인 시각형","읽으며 공부하고 혼자 집중하며 교과서와 시각 자료를 활용하는 유형"],
LIVC:["개인 판서형","읽으며 공부하고 혼자 집중하며 판서와 시각 자료를 활용하는 유형"],
LISB:["개인 청각형","읽으며 공부하고 혼자 집중하면서 설명을 들을 때 편한 유형"],
LISC:["조용한 정리형","읽으며 공부하고 혼자 집중하며 판서로 개념을 확인하는 유형"],
LEVB:["협력 독해형","읽으며 공부하고 친구와 의견을 나누며 교과서와 자료를 활용하는 유형"],
LEVC:["협력 독해 판서형","읽으며 공부하고 친구와 소통하며 판서 중심 수업을 활용하는 유형"],
LESB:["협력 청취형","읽으며 공부하고 친구와 설명을 주고받으며 교과서 중심 수업을 활용하는 유형"],
LESC:["협력 이해형","읽으며 공부하고 친구와 소통하며 판서로 개념을 확인하는 유형"]
};
let i=0,A=[];
function $(x){return document.getElementById(x)}
function start(){i=0;A=[];$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){$("num").textContent=`${i+1} / 20`;$("bar").style.width=(i/20*100)+"%";$("q").textContent=Q[i][0];$("choices").innerHTML=["① 전혀 그렇지 않다","② 그렇지 않다","③ 보통이다","④ 그렇다","⑤ 매우 그렇다"].map((x,n)=>`<label class="choice"><input type="radio" name="a" value="${n+1}">${x}</label>`).join("")}
function next(){let s=document.querySelector('input[name="a"]:checked');if(!s){alert("답변을 선택해주세요!");return}A[i]=+s.value;if(i<19){i++;render()}else{result()}}
function pick(a,b){let x=0,y=0;Q.forEach((q,n)=>{if(q[1]==a)x+=A[n];if(q[1]==b)y+=A[n]});return x>=y?a:b}
function result(){
$("quiz").classList.add("hidden");$("result").classList.remove("hidden");
let c=pick("W","L")+pick("I","E")+pick("V","S")+pick("B","C"), keys=[c[0],c[1],c[2],c[3]], t=TYPES[c];
$("code").textContent=c;$("type").textContent=t?t[0]:"학습 조합형";
$("profile").innerHTML=keys.map(k=>`<div class="pill"><b>${INFO[k][0]} ${INFO[k][1]}</b>${INFO[k][2]}</div>`).join("");
let study={W:"핵심 개념을 직접 써보고 자기 방식으로 다시 정리해보세요.",L:"교과서와 필기를 여러 번 나누어 읽고 핵심 내용을 표시해보세요.",I:"조용한 환경에서 자신의 속도로 공부하고 스스로 정한 분량을 체크해보세요.",E:"친구와 서로 문제를 내고 배운 내용을 설명하며 공부해보세요.",V:"개념도·그래프·사진·도표 등으로 정보를 구조화해보세요.",S:"설명을 집중해서 듣고 소리 내어 요약하거나 다른 사람에게 설명해보세요."};
$("study").textContent=study[keys[0]]+" "+study[keys[1]]+" "+study[keys[2]];
$("teacher").textContent=(keys[3]=="B"?"교과서나 PPT를 체계적으로 활용하는 선생님":"칠판에 핵심 개념과 풀이 과정을 단계적으로 정리해주는 선생님")+"이 잘 맞을 수 있습니다. "+(keys[1]=="E"?"친구들과 질문하고 의견을 나눌 기회가 있는 수업도 활용해보세요.":"혼자 생각하고 문제를 해결할 시간이 있는 수업도 활용해보세요.");
$("summary").textContent=t?t[1]+" "+INFO[keys[0]][1]+"과 "+INFO[keys[1]][1]+"의 특징이 함께 나타납니다.":"여러 학습 전략을 조합해 활용하는 유형입니다.";
}
function restart(){start()}function goHome(){$("result").classList.add("hidden");$("home").classList.remove("hidden")}
</script>
</body>
</html>
